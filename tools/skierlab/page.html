<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>人物实验室 · 雪迹人物</title>
<style>
html,body{margin:0;height:100%;background:#cfd8e2;font:14px/1.4 -apple-system,"PingFang SC","Helvetica Neue",sans-serif;color:#18202a;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
#ui{position:fixed;left:12px;top:12px;max-width:min(560px,calc(100vw - 24px));display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row b{font-weight:600;margin-right:4px;min-width:3em}
button{font:inherit;border:1px solid rgba(24,32,42,.25);background:rgba(255,255,255,.75);border-radius:8px;padding:5px 10px;cursor:pointer;color:#18202a}
button.on{background:#18202a;color:#fff;border-color:#18202a}
#msg{position:fixed;left:12px;bottom:12px;right:12px;font-size:12px;color:#3a4654}
#busy{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;pointer-events:none}
</style></head><body>
<canvas id="cv"></canvas>
<div id="ui">
  <div class="row"><b>手套</b><button data-k="hand" data-v="a">a 原来</button><button data-k="hand" data-v="b">b 手指握杖</button></div>
  <div class="row"><b>姿势</b><button data-k="pose" data-v="stand">站着</button><button data-k="pose" data-v="turnL">左转</button><button data-k="pose" data-v="turnR">右转</button><button data-k="pose" data-v="tuck">团身</button><button data-k="pose" data-v="plant">点杖</button><button data-k="pose" data-v="air">腾空</button><button data-k="pose" data-v="carve">连续转弯</button></div>
  <div class="row"><b>看</b><button data-k="look" data-v="body">全身</button><button data-k="look" data-v="handR">右手</button><button data-k="look" data-v="handL">左手</button><button data-k="look" data-v="front">正面（追身镜头反过来）</button></div>
</div>
<div id="busy">正在用游戏的代码生成人物…</div>
<div id="msg">拖动转视角 · 滚轮或两指缩放 · 这里是游戏里同一个人物模型和同一套姿势代码；衣服的细褶皱和缝线是游戏着色器画的，这页只有底色</div>
