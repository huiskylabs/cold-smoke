<title>雪迹 Cold Smoke</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  color-scheme: dark;
  --ink: #05080d; --snow: #f4f7fb; --dim: rgba(244, 247, 251, .66); --faint: rgba(244, 247, 251, .40); --hair: rgba(244, 247, 251, .22); --sun: #ffd08a;
  --f-song: "Noto Serif SC", "Songti SC", "STSong", "Source Han Serif SC", "Noto Serif CJK SC", "SimSun", serif;
  --f-lat: "Jost", "Futura", "Avenir Next", "Century Gothic", "Segoe UI", system-ui, sans-serif;
  --f-ui: "Jost", "Futura", "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
}
html, body { height: 100%; margin: 0; }
body { background: var(--ink); color: var(--snow); overflow: hidden; overscroll-behavior: none; font-family: var(--f-ui); -webkit-text-size-adjust: 100%; }
#app { position: fixed; inset: 0; overflow: hidden; background: var(--ink); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none;
  /* the frame the picture is shown in: its size (set from script) and the safe margins on each of its own sides */
  --cw: 100vw; --ch: 100vh;
  --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  --gl: max(20px, var(--sl)); --gr: max(20px, var(--sr)); --gt: calc(var(--st) + 16px); --gb: calc(var(--sb) + 18px);
  --col: calc(var(--gl) + clamp(4px, calc(var(--cw) * .04), 76px)); }
/* a phone held upright: the picture is laid on its side and the player turns the phone (works with the rotation lock on) */
#app.rot { inset: auto; left: 50%; top: 50%; width: 100vh; height: 100vw; transform: translate(-50%, -50%) rotate(90deg);
  --sl: env(safe-area-inset-top, 0px); --sr: env(safe-area-inset-bottom, 0px); --st: env(safe-area-inset-right, 0px); --sb: env(safe-area-inset-left, 0px); }
#app.rot.flip { transform: translate(-50%, -50%) rotate(-90deg);
  --sl: env(safe-area-inset-bottom, 0px); --sr: env(safe-area-inset-top, 0px); --st: env(safe-area-inset-left, 0px); --sb: env(safe-area-inset-right, 0px); }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
/* the picture comes up out of black once the first frame exists */
#veil { position: absolute; inset: 0; background: var(--ink); opacity: 1; transition: opacity 1.6s cubic-bezier(.3, 0, .2, 1); pointer-events: none; }
#veil.lift { opacity: 0; }
/* soft shade top and bottom so type stays readable over sky and over sunlit snow */
#shade { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.2s ease;
  background: linear-gradient(to bottom, rgba(5, 8, 13, .42), rgba(5, 8, 13, 0) 22%, rgba(5, 8, 13, 0) 68%, rgba(5, 8, 13, .50)); }
#shade.on { opacity: 1; }
#shade.run { background: linear-gradient(to bottom, rgba(5, 8, 13, .24), rgba(5, 8, 13, 0) 14%, rgba(5, 8, 13, 0) 82%, rgba(5, 8, 13, .34)); }
/* wide: the words stand in a column on the left, on a shade that leaves the rest of the picture alone */
#shade::before { content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease;
  background: linear-gradient(90deg, rgba(5, 8, 13, .80), rgba(5, 8, 13, .64) 17%, rgba(5, 8, 13, .34) 33%, rgba(5, 8, 13, .10) 46%, rgba(5, 8, 13, 0) 57%); }
#app.wide #shade.on::before { opacity: 1; } #app.wide #shade.run::before { opacity: 0; }
#app.wide #shade { background: linear-gradient(to bottom, rgba(5, 8, 13, .30), rgba(5, 8, 13, 0) 20%, rgba(5, 8, 13, 0) 72%, rgba(5, 8, 13, .50)); }
#app.wide #shade.run { background: linear-gradient(to bottom, rgba(5, 8, 13, .22), rgba(5, 8, 13, 0) 16%, rgba(5, 8, 13, 0) 80%, rgba(5, 8, 13, .32)); }
.layer { position: absolute; inset: 0; pointer-events: none; opacity: 0; visibility: hidden; transition: opacity .7s ease, visibility 0s linear .7s; }
.layer.on { opacity: 1; visibility: visible; transition: opacity .9s ease, visibility 0s; }

/* ---- wordmark, shared by the loading and the title page */
.mark { display: flex; flex-direction: column; align-items: center; text-align: center; }
.mark .cn { font-family: var(--f-song); font-weight: 700; font-size: clamp(46px, 15vmin, 84px); line-height: 1; letter-spacing: .42em; margin-right: -.42em; text-shadow: 0 2px 30px rgba(5, 8, 13, .35); }
.mark .rule { width: 26px; height: 1px; background: var(--sun); margin: clamp(14px, 4vmin, 22px) 0 clamp(12px, 3.4vmin, 18px); }
.mark .en { font-family: var(--f-lat); font-weight: 400; font-size: clamp(10px, 2.9vmin, 13px); letter-spacing: .62em; margin-right: -.62em; color: rgba(244, 247, 251, .88); text-shadow: 0 1px 12px rgba(5, 8, 13, .55); }
#load .mark .en { color: var(--dim); text-shadow: none; }

/* ---- loading */
#load { display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--ink); }
#load .mark .cn { font-size: clamp(38px, 12vmin, 64px); text-shadow: none; }
#load .bar { width: min(46vw, 190px); height: 1px; background: var(--hair); margin-top: clamp(34px, 9vmin, 52px); overflow: hidden; }
#load .bar i { display: block; height: 100%; background: var(--sun); transform-origin: 0 50%; transform: scaleX(0); transition: transform .5s cubic-bezier(.2, .6, .2, 1); }
#load .stage { margin-top: 14px; height: 16px; font-size: 11px; letter-spacing: .5em; margin-right: -.5em; color: var(--faint); }

/* ---- title */
#title { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: calc(var(--gt) + clamp(18px, calc(var(--ch) * .07), 64px)) var(--gr) calc(var(--gb) + clamp(10px, calc(var(--ch) * .03), 28px)) var(--gl); box-sizing: border-box; }
#title .tag { margin: clamp(16px, 4.4vmin, 24px) 0 0; font-family: var(--f-song); font-weight: 300; font-size: clamp(13px, 3.7vmin, 16px); letter-spacing: .34em; margin-right: -.34em; color: var(--snow); text-shadow: 0 1px 14px rgba(5, 8, 13, .5); }
#title .mark > *, #title .cta > * { opacity: 0; transform: translateY(8px); transition: opacity 1.1s ease, transform 1.1s cubic-bezier(.2, .6, .2, 1); }
#title.on .mark > *, #title.on .cta > * { opacity: 1; transform: none; }
#title.on .mark > :nth-child(1) { transition-delay: .5s; } #title.on .mark > :nth-child(2) { transition-delay: .8s; } #title.on .mark > :nth-child(3) { transition-delay: .95s; } #title.on .mark > :nth-child(4) { transition-delay: 1.25s; }
#title.on .cta > :nth-child(1) { transition-delay: 1.7s; } #title.on .cta > :nth-child(2) { transition-delay: 1.9s; } #title.on .cta > :nth-child(3) { transition-delay: 2.05s; }
.cta { display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; }
#go { pointer-events: auto; position: relative; appearance: none; -webkit-appearance: none; border: 0; background: linear-gradient(180deg, #f7d6a2, #eeb25c); color: #1b1408; border-radius: 999px;
  min-width: 184px; height: 54px; padding: 0 34px; font-family: var(--f-song); font-weight: 500; font-size: 18px; letter-spacing: .9em; text-indent: .9em; cursor: pointer;
  box-shadow: 0 6px 22px rgba(255, 186, 96, .20), 0 1px 0 rgba(255, 255, 255, .5) inset; transition: filter .25s ease, transform .25s ease; }
#go::after { content: ""; position: absolute; inset: -8px; border-radius: 999px; border: 1px solid rgba(255, 214, 150, .8); opacity: 0; animation: breathe 3.2s ease-in-out infinite; }
#go:active { filter: brightness(.92); transform: scale(.98); }
@media (hover: hover) { #go:hover { filter: brightness(1.06); } }
#go:focus-visible { outline: 2px solid var(--sun); outline-offset: 4px; }
@keyframes breathe { 0%, 100% { opacity: 0; transform: scale(.96); } 50% { opacity: .9; transform: scale(1); } }
.cta .how { margin: 18px 0 0; font-size: 13px; letter-spacing: .16em; color: var(--snow); text-shadow: 0 1px 10px rgba(5, 8, 13, .6); }
.cta .fine { margin: 10px 0 0; max-width: 30em; font-size: 11px; line-height: 1.7; letter-spacing: .1em; color: var(--dim); text-shadow: 0 1px 10px rgba(5, 8, 13, .6); text-wrap: balance; }

/* ---- in play: only what is needed */
#hud .spd { position: absolute; left: var(--gl); bottom: var(--gb); display: flex; flex-direction: column; align-items: flex-start; text-shadow: 0 1px 16px rgba(5, 8, 13, .55); }
#app { --spd: clamp(44px, 13vmin, 64px); } #app.wide { --spd: clamp(40px, 11.5vmin, 88px); }
#hud .spd b { font-family: var(--f-lat); font-weight: 300; font-size: var(--spd); line-height: .9; letter-spacing: -.01em; font-variant-numeric: tabular-nums; min-width: 1.7em; }
#hud .unit { font-family: var(--f-lat); font-weight: 500; font-size: 10px; letter-spacing: .34em; color: var(--dim); margin-top: 8px; }
#hud .tach { width: clamp(64px, 19vmin, 92px); height: 1px; background: var(--hair); margin-top: 9px; overflow: hidden; }
#hud .tach i { display: block; height: 100%; background: var(--sun); transform-origin: 0 50%; transform: scaleX(0); }
#hud .drop { position: absolute; right: var(--gr); bottom: var(--gb); display: flex; flex-direction: column; align-items: flex-end; text-shadow: 0 1px 16px rgba(5, 8, 13, .55); }
#hud .drop b { font-family: var(--f-lat); font-weight: 300; font-size: clamp(24px, 7vmin, 34px); line-height: 1; font-variant-numeric: tabular-nums; }
#hud .drop .unit { letter-spacing: .3em; margin-right: -.3em; }
/* the name of the run, each time the mountain changes */
#seg { position: absolute; left: var(--gl); top: calc(var(--gt) + 2px); padding-left: 14px; opacity: 0; transform: translateX(-10px); transition: opacity .9s ease, transform .9s cubic-bezier(.2, .6, .2, 1); text-shadow: 0 1px 16px rgba(5, 8, 13, .6); }
#seg::before { content: ""; position: absolute; left: 0; top: 2px; bottom: 2px; width: 1px; background: var(--sun); transform-origin: 50% 0; transform: scaleY(0); transition: transform .7s cubic-bezier(.2, .6, .2, 1) .1s; }
#seg.on { opacity: 1; transform: none; } #seg.on::before { transform: none; }
#seg small { display: block; font-family: var(--f-lat); font-weight: 500; font-size: 10px; letter-spacing: .34em; color: var(--dim); }
#seg b { display: block; margin-top: 7px; font-family: var(--f-song); font-weight: 300; font-size: clamp(26px, 7.6vmin, 36px); line-height: 1.1; letter-spacing: .3em; }
/* how to steer, until the first real turn */
#hint { position: absolute; left: 50%; bottom: calc(var(--gb) + clamp(92px, calc(var(--ch) * .17), 150px)); display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 22px 0 16px; border-radius: 999px; background: rgba(5, 8, 13, .46); white-space: nowrap;
  opacity: 0; transform: translate(-50%, 8px); transition: opacity .8s ease, transform .8s cubic-bezier(.2, .6, .2, 1); }
#hint.on { opacity: 1; transform: translate(-50%, 0); }
#hint span { font-size: 13px; letter-spacing: .22em; margin-right: -.22em; }
#hint i { display: block; position: relative; width: 44px; height: 34px; flex: none; }
#hint.tilt i::before { content: ""; position: absolute; left: 50%; top: 50%; width: 17px; height: 28px; margin: -14px 0 0 -8.5px; border: 1.5px solid var(--snow); border-radius: 4.5px; box-sizing: border-box; animation: rock 2.4s ease-in-out infinite; }
#hint.drag i::before { content: ""; position: absolute; left: 2px; right: 2px; top: 50%; height: 1px; background: var(--faint); }
#hint.drag i::after { content: ""; position: absolute; left: 50%; top: 50%; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%; background: var(--snow); animation: slide 2.4s ease-in-out infinite; }
#hint.keys, #hint.pace, #hint.moves { padding-left: 22px; } #hint.keys i, #hint.pace i, #hint.moves i { display: none; }
@keyframes rock { 0%, 100% { transform: rotate(-19deg); } 50% { transform: rotate(19deg); } }
@keyframes slide { 0%, 100% { transform: translateX(-15px); } 50% { transform: translateX(15px); } }
/* sound */
#snd { position: absolute; right: calc(var(--gr) - 10px); top: calc(var(--gt) - 10px); width: 44px; height: 44px; padding: 0; border: 0; background: none; color: var(--snow); cursor: pointer; opacity: 0; visibility: hidden; transition: opacity .8s ease, visibility 0s linear .8s; filter: drop-shadow(0 1px 8px rgba(5, 8, 13, .6)); }
#snd.on { opacity: .82; visibility: visible; transition: opacity .8s ease, visibility 0s; }
#snd svg { width: 20px; height: 20px; display: block; margin: auto; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
#snd .off { display: none; } #snd.mute .off { display: inline; } #snd.mute .wave { display: none; } #snd.mute { color: var(--dim); }
#snd:focus-visible, #fs:focus-visible, #pz:focus-visible { outline: 2px solid var(--sun); outline-offset: -6px; border-radius: 50%; }
#fs { position: absolute; right: calc(var(--gr) + 30px); top: calc(var(--gt) - 10px); width: 44px; height: 44px; padding: 0; border: 0; background: none; color: var(--snow); cursor: pointer; opacity: 0; visibility: hidden; transition: opacity .8s ease, visibility 0s linear .8s; filter: drop-shadow(0 1px 8px rgba(5, 8, 13, .6)); }
#fs.on { opacity: .82; visibility: visible; transition: opacity .8s ease, visibility 0s; }
#fs svg { width: 18px; height: 18px; display: block; margin: auto; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
#fs .in { display: none; } #fs.full .in { display: inline; } #fs.full .out { display: none; }
/* setting the run down for a moment: there only while there is a run */
#pz { position: absolute; right: calc(var(--gr) + 30px); top: calc(var(--gt) - 10px); width: 44px; height: 44px; padding: 0; border: 0; background: none; color: var(--snow); cursor: pointer; opacity: 0; visibility: hidden; transition: opacity .5s ease, visibility 0s linear .5s; filter: drop-shadow(0 1px 8px rgba(5, 8, 13, .6)); }
#app.hasfs #pz { right: calc(var(--gr) + 70px); }
#app.run #pz { opacity: .82; visibility: visible; transition: opacity .8s ease .35s, visibility 0s; }
#pz svg { width: 18px; height: 18px; display: block; margin: auto; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
/* ---- the scene switch: one small button beside the other two, and the sheet it opens. Time of day, kind of run, the things otherwise
   only met by chance, the view, the mountain: each a row of words; what is chosen stands on the amber hairline the page uses everywhere */
#app { --swf: 13px; --swl: 11px; --swh: 44px; } #app.desk { --swf: clamp(13px, 1.75vmin, 15px); --swl: clamp(11px, 1.45vmin, 12px); --swh: clamp(36px, 4.6vmin, 40px); }
#sw { position: absolute; right: calc(var(--gr) + 32px); top: calc(var(--gt) - 10px); height: 44px; margin: 0; padding: 0 4px; border: 0; background: none; color: var(--snow); font-family: var(--f-ui); cursor: pointer; opacity: 0; visibility: hidden; transition: opacity .8s ease, visibility 0s linear .8s; }
#app.hasfs #sw, #app.run #sw { right: calc(var(--gr) + 72px); } #app.hasfs.run #sw { right: calc(var(--gr) + 112px); }
#sw.on { opacity: 1; visibility: visible; transition: opacity .8s ease, visibility 0s, right .6s cubic-bezier(.2, .6, .2, 1); }
#sw span { display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 9px; border-radius: 999px; background: rgba(5, 8, 13, .34); box-shadow: inset 0 0 0 1px var(--hair); font-size: calc(var(--swf) - 1px); letter-spacing: .22em; white-space: nowrap; transition: background .3s ease, box-shadow .3s ease; }
#sw svg { display: block; flex: none; width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.3; transition: color .3s ease; } #sw svg .half { fill: currentColor; stroke: none; }
#sw.open span { background: rgba(5, 8, 13, .62); box-shadow: inset 0 0 0 1px rgba(255, 208, 138, .7); } #sw.open svg { color: var(--sun); }
#sw:focus-visible { outline: none; } #sw:focus-visible span { outline: 2px solid var(--sun); outline-offset: 2px; }
#swp { position: absolute; right: calc(var(--gr) - 4px); top: calc(var(--gt) + 34px); box-sizing: border-box; max-width: calc(var(--cw) - var(--gl) - var(--gr) + 8px); padding: 3px 8px 3px 16px; border-radius: 14px; background: rgba(5, 8, 13, .62); box-shadow: inset 0 0 0 1px rgba(244, 247, 251, .09); font-family: var(--f-ui); pointer-events: none;
  opacity: 0; visibility: hidden; transform: translateY(-6px); transition: opacity .3s ease, transform .3s cubic-bezier(.2, .6, .2, 1), visibility 0s linear .3s; }
#swp.on { opacity: 1; visibility: visible; pointer-events: auto; transform: none; transition: opacity .35s ease, transform .45s cubic-bezier(.2, .6, .2, 1), visibility 0s; }
#swp .row { display: flex; align-items: center; min-height: var(--swh); } #swp .row + .row { box-shadow: 0 -1px 0 rgba(244, 247, 251, .08); }
#swp .row[hidden], #swp .grp[hidden] { display: none; }
#swp .two { justify-content: space-between; } #swp .grp { display: flex; align-items: center; } #swp .grp + .grp { margin-left: 22px; }
#swp .lab { flex: none; min-width: 5em; font-size: var(--swl); letter-spacing: .34em; color: var(--dim); white-space: nowrap; } #swp .grp + .grp .lab { min-width: 0; margin-right: .5em; }
#swp kbd { margin-left: .1em; font-family: var(--f-lat); font-size: calc(var(--swl) - 1px); font-weight: 500; letter-spacing: .08em; color: var(--faint); } #swp button kbd { margin-left: .45em; }
#app:not(.desk) #swp kbd { display: none; } #app:not(.desk) #swp .lab { min-width: 3.7em; }
#swp .chips { display: flex; flex-wrap: wrap; align-items: center; }
#swp button { position: relative; appearance: none; -webkit-appearance: none; margin: 0; border: 0; background: none; height: var(--swh); min-width: 40px; padding: 0 9px 0 calc(9px + .14em); font: inherit; font-size: var(--swf); letter-spacing: .14em; color: var(--dim); white-space: nowrap; cursor: pointer; transition: color .25s ease; }
#swp button::after { content: ""; position: absolute; left: calc(9px + .14em); right: calc(9px + .14em); bottom: calc(var(--swh) * .5 - 13px); height: 1px; background: var(--sun); transform: scaleX(0); transform-origin: 0 50%; transition: transform .4s cubic-bezier(.2, .6, .2, 1); }
#swp button.on, #swp button.hit { color: var(--snow); } #swp button.on::after, #swp button.hit::after { transform: none; }
/* (while the clock runs by itself: a grain of amber under the hour it has reached) */
#swp button.now::before { content: ""; position: absolute; left: 50%; bottom: calc(var(--swh) * .5 - 14px); width: 3px; height: 3px; margin-left: -1.5px; border-radius: 50%; background: var(--sun); }
@media (hover: hover) { #swp button:hover { color: var(--snow); } }
#swp button:active { color: var(--sun); }
#swp button:focus-visible { outline: 2px solid var(--sun); outline-offset: -5px; border-radius: 8px; }
#swp .sep { flex: none; width: 1px; height: 13px; margin: 0 7px; background: var(--hair); }
#swp .seed { font-family: var(--f-lat); font-size: var(--swf); letter-spacing: .1em; font-variant-numeric: tabular-nums; color: var(--snow); }
#swp .step i { font-style: normal; font-family: var(--f-lat); margin-left: .45em; color: var(--dim); }
#app:not(.desk) #swp button { min-width: 44px; letter-spacing: .08em; padding: 0 7px 0 calc(7px + .08em); }
#app:not(.desk) #swp button::after { left: calc(7px + .08em); right: calc(7px + .08em); }
#app:not(.desk) #swp { top: calc(var(--gt) + 46px); }          /* (clear of the drop number beside the pill) */
/* what a key just changed, said once: in the column of type on the left, clear of the sun (at the gate where the name of a run would stand, in a run under the hints) */
#say { position: absolute; left: var(--col); top: calc(var(--gt) + 2px); display: flex; align-items: center; gap: 12px; height: 34px; padding: 0 18px; border-radius: 999px; background: rgba(5, 8, 13, .40); white-space: nowrap; pointer-events: none;
  opacity: 0; transform: translateX(-10px); transition: opacity .5s ease, transform .5s cubic-bezier(.2, .6, .2, 1); }
#say.on { opacity: 1; transform: none; }
#app.run #say { left: var(--gl); top: calc(var(--ht) + 56px); }
#say small { font-size: 11px; letter-spacing: .34em; margin-right: -.34em; color: var(--dim); } #say b { font-weight: 400; font-size: 13px; letter-spacing: .2em; margin-right: -.2em; } #say b:empty { display: none; }
#app.wide.short #say { height: 32px; } #app.wide.short.run #say { top: calc(var(--ht) + 48px); }
/* a change of place is a cut: the picture dips to black over it, the words stay */
#cut { position: absolute; inset: 0; background: var(--ink); opacity: 0; pointer-events: none; } #cut.slow { transition: opacity .26s ease; }
/* held in the hands: the two moves, under the right thumb (the left one steers). Jump in the corner where the thumb lies, accelerate a reach inward */
#pad button { position: absolute; appearance: none; -webkit-appearance: none; margin: 0; padding: 0; border: 0; border-radius: 50%; background: rgba(5, 8, 13, .30); box-shadow: inset 0 0 0 1px rgba(244, 247, 251, .36); color: var(--snow); font-family: var(--f-ui); text-shadow: 0 1px 8px rgba(5, 8, 13, .5);
  pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; transition: background .12s ease, color .12s ease, transform .12s ease, box-shadow .12s ease; }
#jump { right: calc(var(--gr) + 8px); bottom: calc(var(--gb) + 38px); width: 72px; height: 72px; font-size: 20px; }
#tuck { right: calc(var(--gr) + 94px); bottom: calc(var(--gb) + 2px); width: 60px; height: 60px; font-size: 13px; letter-spacing: .12em; text-indent: .12em; }
#pad button.down { background: rgba(255, 208, 138, .92); box-shadow: none; color: #1b1408; text-shadow: none; transform: scale(.95); }
/* (held, the jump loads: the ring round it closes as the legs fold) */
#jump::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; background: conic-gradient(var(--sun) calc(var(--k, 0) * 1turn), rgba(244, 247, 251, 0) 0); opacity: 0; transition: opacity .2s ease;
