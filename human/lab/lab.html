<title>人体实验室</title>
<style>
  :root { --bg: #eeeef0; --ink: #222; --dim: #777; --card: rgba(255,255,255,0.86); --line: #ddd; --acc: #2f5d8a; }
  /* the lab is a light studio in both themes (the body is judged against a neutral grey); the panel follows the theme */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink: #eee; --dim: #aaa; --card: rgba(30,30,34,0.86); --line: #444; } }
  :root[data-theme="dark"] { --ink: #eee; --dim: #aaa; --card: rgba(30,30,34,0.86); --line: #444; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.45 -apple-system, "PingFang SC", "Noto Sans SC", system-ui, sans-serif; overflow: hidden; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #ui { position: fixed; top: 12px; left: 12px; bottom: 12px; width: 300px; overflow-y: auto; background: var(--card); backdrop-filter: blur(10px); border-radius: 12px; padding: 12px 14px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); }
  h1 { font-size: 16px; margin: 0 0 2px; } h2 { font-size: 12px; color: var(--dim); font-weight: 600; margin: 14px 0 6px; letter-spacing: 0.04em; }
  .sub { color: var(--dim); font-size: 12px; margin: 0 0 4px; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 4px 10px; margin: 0 4px 5px 0; font: inherit; font-size: 12px; cursor: pointer; }
  .chip.on { background: var(--acc); color: #fff; border-color: var(--acc); } .chip.go { background: #222; color: #fff; border-color: #222; }
  label { display: grid; grid-template-columns: 1fr 120px 40px; align-items: center; gap: 6px; margin: 3px 0; font-size: 12px; }
  label b { font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; } input[type=range] { width: 100%; }
  .row { margin-top: 6px; } .grp { display: block; color: var(--dim); font-size: 11px; margin: 4px 0 3px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; } td, th { padding: 2px 4px; text-align: right; } td:first-child, th:first-child { text-align: left; } th { color: var(--dim); font-weight: 500; }
  #metrics p { margin: 6px 0; font-size: 12px; } .dim { color: var(--dim); }
  #status { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: rgba(0,0,0,0.75); color: #fff; padding: 6px 14px; border-radius: 999px; font-size: 12px; transition: opacity .3s; pointer-events: none; }
  #toggle { position: fixed; top: 12px; right: 12px; } body.hide #ui { display: none; } body.hide #toggle { opacity: 0.5; }
  @media (max-width: 700px) { #ui { top: auto; height: 42%; left: 16px; right: 16px; width: auto; bottom: 16px; box-sizing: border-box; } }
</style>
<canvas id="gl"></canvas>
<div id="ui">
  <h1>人体实验室 · 第 2 步</h1>
  <p class="sub">全部由代码算出：59 根骨、ANSUR 体型、肌肉和动作，不用任何模型文件。拖动旋转，滚轮缩放。</p>
  <h2>身体</h2><div id="kinds"></div>
  <h2>姿势（压力测试）</h2><div id="poses"></div>
  <h2>动作</h2><div id="clips"></div>
  <h2>蒙皮方法</h2><div id="modes"></div>
  <h2>显示</h2><div id="looks"></div>
  <h2>体型</h2><div id="sliders"></div>
  <h2>测量</h2><div id="metrics"></div>
</div>
<button class="chip" id="toggle">面板</button>
<div id="status"></div>
<script>
/*__JS__*/
</script>
